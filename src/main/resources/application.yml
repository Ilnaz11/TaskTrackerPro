spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tasktrackerpro
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  mvc:
    locale: ru_RU

  web:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
