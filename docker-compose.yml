version: "3.9"

services:
  app:
    image: eclipse-temurin:21-jdk
    container_name: spring-app
    working_dir: /app
    volumes:
      - ./target:/app
    command: ["java", "-jar", "tasktrackerpro-0.0.1-SNAPSHOT.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_DB=tasktrackerpro
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
